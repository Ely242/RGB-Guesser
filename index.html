<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Guesser</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="assets/favicon.png" type="image/png">
</head>
<body>
    <div class="hero">
        <h1 class="hero-title">Color Guesser</h1>
    </div>

    <main class="game-container">
        <section class="color-display">
            <div class="color-box-wrapper">
                <h2 class="color-box-label">Target Color</h2>
                <div class="color-box" id="target-color-box"></div>
                <p class="hex-label" id="target-hex">???</p>
            </div>

            <div class="color-box-wrapper">
                <h2 class="color-box-label">Your Guess</h2>
                <div class="color-box" id="guess-color-box"></div>
                <p class="hex-label" id="guess-hex">#------</p>
            </div>
        </section>

        <section class="controls">
            <div class="slider-group red-slider-group">
                <div class="slider-header">
                    <label for="red-slider">Red</label>
                    <span class="value-display" id="red-value">0</span>
                </div>
                <input type="range" id="red-slider" min="0" max="255" value="0" class="rgb-slider">
            </div>

            <div class="slider-group green-slider-group">
                <div class="slider-header">
                    <label for="green-slider">Green</label>
                    <span class="value-display" id="green-value">0</span>
                </div>
                <input type="range" id="green-slider" min="0" max="255" value="0" class="rgb-slider">
            </div>

            <div class="slider-group blue-slider-group">
                <div class="slider-header">
                    <label for="blue-slider">Blue</label>
                    <span class="value-display" id="blue-value">0</span>
                </div>
                <input type="range" id="blue-slider" min="0" max="255" value="0" class="rgb-slider">
            </div>
        </section>

        <section class="actions">
            <button type="button" id="check-guess-btn">Check Guess</button>
            <button type="button" id="new-color-btn">New Color</button>
        </section>

        <div id="scoreModal" class="modal-overlay">
            <div class="modal-box">
                <h2 id="score-message">---</h2>
                <p>Your score: <span id="modal-score-value">100%</span></p>
                <div class="modal-target-info">
                    <p class="target-label">Target Color</p>
                    <div class="modal-target-color-box" id="modal-target-color-box"></div>
                    <p class="target-hex" id="modal-target-hex">#??????</p>
                    <p class="target-rgb">
                        <button type="button" class="channel-reveal" id="reveal-r" data-channel="r"><span class="rgb-label">R:</span> <span id="modal-target-r">?</span></button>
                        <button type="button" class="channel-reveal" id="reveal-g" data-channel="g"><span class="rgb-label">G:</span> <span id="modal-target-g">?</span></button>
                        <button type="button" class="channel-reveal" id="reveal-b" data-channel="b"><span class="rgb-label">B:</span> <span id="modal-target-b">?</span></button>
                    </p>
                </div>
                <button id="close-modal-btn">Close</button>
                <div class="modal-actions">
                    <button type="button" id="modal-new-color-btn">New Color</button>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
